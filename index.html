<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gram Swarajya Mandal, Someshwar</title>
<meta name="robots" content="noindex">
<style>
html, body { height: 100%; }
body { margin: 0; background: #8a8f8a; color: #333; font-family: system-ui, "Noto Sans Devanagari", sans-serif; line-height: 1.6; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
.box { background: #f0f2f4; max-width: 40rem; width: 100%; padding: 2rem 1.5rem 2.25rem; border-radius: 6px; box-shadow: 0 6px 24px rgb(0 0 0 / .25); text-align: center; box-sizing: border-box; }
h1 { margin: 0 0 1rem; font-weight: 400; font-size: clamp(1.8rem, 6vw, 2.6rem); line-height: 1.2; }
p { margin: 0; font-size: 1.05rem; }
</style>
</head>
<body>
<div class="box" role="alert">
<h1>तकनीकी समस्या</h1>
<p>हम इस समस्या को ठीक कर रहे हैं और वेबसाइट जल्द ही फिर से उपलब्ध होगी। असुविधा के लिए खेद है।</p>
</div>
</body>
</html>
